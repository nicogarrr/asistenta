name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# En una PR, un push nuevo cancela la ejecución anterior (solo importa la última).
# En main NO: con muchas PRs mergeándose seguidas, cancelar dejaba main sin ningún
# resultado de CI terminado (todas las ejecuciones de main salían «cancelled»).
# Sin cancelar, la ejecución en curso termina y solo queda en cola la más reciente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint:check
      - run: npm run build
      # Los tests de navegador real necesitan Chromium; sin él fallan por entorno, no por código.
      # Chromium (~150 MB) en caché por versión de Playwright; las dependencias del
      # sistema (apt) no se pueden cachear y se instalan siempre.
      - name: Versión de Playwright
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Caché de navegadores de Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # La cobertura se mide en la suite general (la fase de recursos lanza procesos hijos).
      - run: npm test -- --coverage
        env:
          CI: '1'
          # Los tests de agenda esperan la hora de Nico, no UTC.
          TZ: Europe/Madrid
      - name: Resumen de cobertura
        if: always()
        run: node scripts/coverage-summary.mjs coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Informe de cobertura (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
      # Bateria de evaluacion (25 tareas): valida la propia bateria y sus checks.
      - run: node scripts/run-evals.mjs --dry

  # Mocks del driver telnet y del canal del boton TV: sin red externa ni tele.
  tv-mocks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: scripts/tv/test-tv-token-patch-mock.sh
      - run: scripts/tv/test-tv-rollback-mock.sh

  # Windows es la plataforma de producción. Solo se ejecuta un subconjunto sin
  # navegador real, micrófono ni escritorio interactivo (eso solo se prueba en el PC).
  # Gate bloqueante tras primera ejecución Windows verde en el PR.
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: >-
          npx vitest run
          test/windows-daemon-control.test.ts
          test/windows-screen-dpi.test.ts
          test/windows-autostart.test.ts
          test/autostart.test.ts
          test/windows-launcher.test.ts
          test/windows-platform.test.ts
          test/platform-desktop-tools.test.ts
          test/vault-portable.test.ts
          test/vault-file-lock.test.ts
          test/lifecycle-pidfile.test.ts
          test/envfile-loads.test.ts
          test/envfile-malformed.test.ts
          test/envfile-missing.test.ts
          test/envfile-no-override.test.ts
          test/status.test.ts
          test/daemon-status.test.ts
        env:
          CI: '1'
          TZ: Europe/Madrid

      - name: OCR real de documentos (imagen sintetica)
        if: always()
        run: npx vitest run test/ocrdoc-windows.test.ts
        env:
          CI: '1'

      - name: Synthetic DPI corner frames (no desktop/user capture)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-dpi-frames
          path: test-output/dpi-*.jpg
          if-no-files-found: ignore

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint:check
      - run: npm run build
      # Los tests de navegador real necesitan Chromium; sin él fallan por entorno, no por código.
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CI: '1'

name: Instalador Windows

# Al publicar una versión en GitHub (Releases), construye el instalador .exe en Linux
# (NSIS) y lo adjunta a esa versión con su SHA-256, para descargarlo sin compilar.
# `pa autoupdate` en la copia instalada busca justo estos dos ficheros.
# Este workflow nunca crea etiquetas ni versiones: solo añade ficheros a una ya publicada.
# A mano (workflow_dispatch) sin etiqueta solo construye y lo deja como artefacto. Con la
# etiqueta de una versión en BORRADOR se lo adjunta a ese borrador (Nico lo publica luego);
# al publicarla, si ya trae el instalador, no se rehace (su SHA-256 de las notas sigue valiendo).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      etiqueta:
        description: 'Etiqueta de una versión en borrador (p. ej. v0.1.0); vacío = solo artefacto'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: instalador-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  instalador:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name || inputs.etiqueta }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: La etiqueta coincide con package.json
        if: env.TAG != ''
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "La etiqueta $TAG no coincide con la versión de package.json ($VERSION)."
            exit 1
          fi
      - name: ¿La versión ya trae el instalador?
        id: ya
        if: env.TAG != ''
        run: |
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx 'Asistenta-Instalador.sha256'; then
            echo "Esta versión ya trae el instalador: no lo rehago."
            echo "trae=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Instalar NSIS
        if: steps.ya.outputs.trae != '1'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - if: steps.ya.outputs.trae != '1'
        run: npm ci
      - if: steps.ya.outputs.trae != '1'
        run: npm run build
      - if: steps.ya.outputs.trae != '1'
        run: npm run build:instalador
      - name: SHA-256 del instalador
        if: steps.ya.outputs.trae != '1'
        working-directory: var
        run: sha256sum Asistenta-Instalador-*.exe | tee Asistenta-Instalador.sha256
      - name: Adjuntar a la versión
        if: env.TAG != '' && steps.ya.outputs.trae != '1'
        run: gh release upload "$TAG" var/Asistenta-Instalador-*.exe var/Asistenta-Instalador.sha256 --clobber
      - name: Guardar como artefacto
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: Asistenta-Instalador
          path: |
            var/Asistenta-Instalador-*.exe
            var/Asistenta-Instalador.sha256
          retention-days: 7

name: Windows

# Windows es la plataforma de producción. Solo se ejecuta un subconjunto sin
# navegador real, micrófono ni escritorio interactivo (eso solo se prueba en el PC).
# En PRs solo corre si la PR toca lo que estos tests cubren (es el job más lento y
# atascaba la cola). En cada push a main corre siempre: lo que se escape del filtro
# (una dependencia transitiva) se ve ahí. El test ci-workflow comprueba que
# cada test de la lista y lo que importa de src/ está dentro del filtro.
on:
  pull_request:
    paths:
      - 'src/autostart.ts'
      - 'src/cli.ts'
      - 'src/config.ts'
      - 'src/controlled-daemon.ts'
      - 'src/daemon-control.ts'
      - 'src/daemon-status.ts'
      - 'src/envfile*.ts'
      - 'src/lifecycle.ts'
      - 'src/ocrdoc/**'
      - 'src/paths.ts'
      - 'src/platform.ts'
      - 'src/screen/**'
      - 'src/status.ts'
      - 'src/tools/computer.ts'
      - 'src/tools/iphone.ts'
      - 'src/tools/tv.ts'
      - 'src/vault*.ts'
      - 'src/windows-*.ts'
      - 'test/windows-*.ts'
      - 'test/autostart.test.ts'
      - 'test/platform-desktop-tools.test.ts'
      - 'test/vault-*.test.ts'
      - 'test/lifecycle-pidfile.test.ts'
      - 'test/envfile-*.test.ts'
      - 'test/status.test.ts'
      - 'test/daemon-status.test.ts'
      - 'test/ocrdoc-windows.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vitest.config.ts'
      - '.github/workflows/windows.yml'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: >-
          npx vitest run
          test/windows-daemon-control.test.ts
          test/windows-screen-dpi.test.ts
          test/windows-autostart.test.ts
          test/autostart.test.ts
          test/windows-launcher.test.ts
          test/windows-platform.test.ts
          test/platform-desktop-tools.test.ts
          test/vault-portable.test.ts
          test/vault-file-lock.test.ts
          test/lifecycle-pidfile.test.ts
          test/envfile-loads.test.ts
          test/envfile-malformed.test.ts
          test/envfile-missing.test.ts
          test/envfile-no-override.test.ts
          test/status.test.ts
          test/daemon-status.test.ts
        env:
          CI: '1'
          TZ: Europe/Madrid

      - name: OCR real de documentos (imagen sintetica)
        if: always()
        run: npx vitest run test/ocrdoc-windows.test.ts
        env:
          CI: '1'

      - name: Synthetic DPI corner frames (no desktop/user capture)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-dpi-frames
          path: test-output/dpi-*.jpg
          if-no-files-found: ignore
